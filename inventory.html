<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المخزن | Prestige Abaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #fff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0f766e;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Tajawal', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
    .sub { margin: 0.15rem 0 0; font-size: 0.875rem; color: var(--muted); }
    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.875rem;
      margin-inline-start: 0.75rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
    }
    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 700;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      align-items: end;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    input {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }
    input:focus {
      outline: 2px solid #99f6e4;
      border-color: var(--accent);
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-ghost {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.65rem 0.5rem;
      text-align: right;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--muted);
      font-weight: 600;
    }
    tbody tr:last-child td { border-bottom: none; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem 0.5rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    #status {
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.25rem;
    }
    #status.is-error { color: var(--danger); }
    #status.is-ok { color: var(--accent); }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>المخزن</h1>
        <p class="sub">إدارة المنتجات من جدول inventory</p>
      </div>
      <nav class="nav" aria-label="روابط">
        <a href="index.html">المبيعات</a>
        <a href="dashboard.html">لوحة التحكم</a>
      </nav>
    </header>

    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">إضافة منتج</h2>
      <form id="add-form" class="form-grid" novalidate>
        <div>
          <label for="product_name">اسم المنتج</label>
          <input id="product_name" name="product_name" type="text" required autocomplete="off" placeholder="مثال: عباية سوداء">
        </div>
        <div>
          <label for="price">السعر (AUD)</label>
          <input id="price" name="price" type="number" min="0" step="0.01" required value="0">
        </div>
        <div>
          <label for="stock_quantity">الكمية</label>
          <input id="stock_quantity" name="stock_quantity" type="number" min="0" step="1" required value="0">
        </div>
        <div>
          <button type="submit" class="btn-primary" id="submit-btn">إضافة</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <div class="toolbar">
        <h2 id="list-heading" style="margin:0">قائمة المخزون</h2>
        <button type="button" class="btn-ghost" id="refresh-btn">تحديث</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>اسم المنتج</th>
              <th>السعر</th>
              <th>الكمية</th>
            </tr>
          </thead>
          <tbody id="inventory-body">
            <tr><td colspan="3" class="empty">جاري التحميل…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.config.js"></script>
  <script src="db-helper.js?v=20260520-db-helper"></script>
  <script src="inventory.js?v=20260520-warehouse"></script>
</body>
</html>
