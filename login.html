<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Prestige Abaya</title>
  <link rel="stylesheet" href="style.css?v=20260524-dashboard-ui">
</head>
<body class="auth-page-body">
  <main class="auth-page">
    <div class="auth-page__card card">
      <h1 class="auth-page__title">Prestige Abaya</h1>
      <p class="auth-page__subtitle">تسجيل الدخول إلى النظام</p>
      <div id="login-error" class="auth-form__error" hidden role="alert"></div>
      <form id="login-form" class="auth-form">
        <div class="auth-form__field">
          <label for="login-email">البريد الإلكتروني</label>
          <input type="email" id="login-email" name="email" required autocomplete="username">
        </div>
        <div class="auth-form__field">
          <label for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn--primary auth-form__submit">دخول</button>
      </form>
      <p class="auth-page__footer"><a href="client-portal.html">بوابة العملاء</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.config.js"></script>
  <script src="db-helper.js"></script>
  <script src="supabase-bridge.js"></script>
  <script src="auth-guard.js?v=20260524"></script>
  <script>
    (function () {
      const form = document.getElementById('login-form');
      const errEl = document.getElementById('login-error');

      function showError(msg) {
        if (!errEl) return;
        errEl.textContent = msg || '';
        errEl.hidden = !msg;
      }

      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        showError('');
        const email = document.getElementById('login-email')?.value?.trim();
        const password = document.getElementById('login-password')?.value || '';

        const bridge = window.SupabaseBridge;
        if (!bridge?.signIn) {
          showError('Supabase غير مهيأ');
          return;
        }

        const res = await bridge.signIn(email, password);
        if (!res.ok) {
          showError(res.error || 'فشل تسجيل الدخول');
          return;
        }

        const role = await AuthGuard.resolveUserRole(res.user);
        if (role === 'admin') {
          location.replace('index.html');
        } else {
          location.replace('client-portal.html');
        }
      });
    })();
  </script>
</body>
</html>
